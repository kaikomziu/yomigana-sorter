<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>読み仮名順テキスト並べ替え</title>
  <style>
    :root {
      color-scheme: light;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f5f7fb;
      color: #20242a;
    }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; }
    main { width: min(960px, calc(100% - 32px)); margin: 0 auto; padding: 32px 0 40px; }
    h1 { margin: 0 0 8px; font-size: clamp(1.45rem, 3vw, 2rem); }
    .description { margin: 0 0 24px; color: #5b6470; }
    .panel { background: #fff; border: 1px solid #dfe4ec; border-radius: 14px; padding: 20px; box-shadow: 0 5px 18px rgba(34, 48, 73, .06); }
    label { display: block; margin-bottom: 8px; font-weight: 700; }
    textarea { display: block; width: 100%; min-height: 220px; resize: vertical; padding: 12px 14px; border: 1px solid #c8d0dc; border-radius: 9px; font: inherit; line-height: 1.65; color: inherit; background: #fff; }
    textarea:focus { outline: 3px solid rgba(52, 113, 240, .2); border-color: #3471f0; }
    .actions { display: flex; align-items: center; gap: 12px; margin: 18px 0; flex-wrap: wrap; }
    button { border: 0; border-radius: 9px; padding: 11px 22px; font: inherit; font-weight: 700; color: #fff; background: #2864d7; cursor: pointer; }
    button:hover { background: #1f53ba; }
    button:disabled { cursor: wait; opacity: .65; }
    select { border: 1px solid #c8d0dc; border-radius: 9px; padding: 10px 12px; font: inherit; color: inherit; background: #fff; cursor: pointer; }
    .secondary-button { background: #596579; }
    .secondary-button:hover { background: #465267; }
    .status { color: #5b6470; font-size: .92rem; }
    .result-label { display: flex; justify-content: space-between; gap: 12px; align-items: baseline; }
    .hint { color: #727b88; font-size: .85rem; font-weight: 400; }
    footer { margin-top: 18px; color: #7a838e; font-size: .78rem; }
    @media (max-width: 600px) { main { width: min(100% - 20px, 960px); padding-top: 22px; } .panel { padding: 14px; } textarea { min-height: 180px; } }
  </style>
</head>
<body>
  <main>
    <h1>読み仮名順テキスト並べ替え</h1>
    <p class="description">各行の読み仮名を自動推定し、あいうえお順に並べ替えます。</p>

    <section class="panel">
      <label for="source">入力</label>
      <textarea id="source" spellcheck="false" placeholder="例：&#10;/おはよう&#10;/しね&#10;/かるびの迷言集"></textarea>

      <div class="actions">
        <label for="sortOrder" class="sr-only">並び順</label>
        <select id="sortOrder" aria-label="並び順">
          <option value="asc">昇順（あ→ん / A→Z）</option>
          <option value="desc">逆順（ん→あ / Z→A）</option>
        </select>
        <button id="sortButton" type="button">並べ替え</button>
        <span id="status" class="status" aria-live="polite">辞書の読み込み準備中…</span>
      </div>

      <div class="result-label">
        <label for="result">結果</label>
        <span class="hint">そのままコピーできます</span>
      </div>
      <textarea id="result" readonly spellcheck="false" placeholder="ここに並べ替え結果が表示されます"></textarea>
      <div class="actions">
        <button id="downloadButton" class="secondary-button" type="button" disabled>結果をダウンロード（.txt）</button>
      </div>
    </section>

    <footer>Version 1.1.1　変更履歴：2026-09-22 読み込み固まり対策（非同期CDN・タイムアウト・代替CDN）</footer>
  </main>

  <!-- kuromoji.js本体は、画面を固めないようJavaScriptから非同期で読み込みます。 -->
  <script>
    'use strict';

    const source = document.getElementById('source');
    const result = document.getElementById('result');
    const sortOrder = document.getElementById('sortOrder');
    const sortButton = document.getElementById('sortButton');
    const downloadButton = document.getElementById('downloadButton');
    const status = document.getElementById('status');
    let tokenizer = null;
    let tokenizerPromise = null;

    const kuromojiSources = [
      {
        script: 'https://cdn.jsdelivr.net/npm/kuromoji@0.1.2/build/kuromoji.js',
        dicPath: 'https://cdn.jsdelivr.net/npm/kuromoji@0.1.2/dict/'
      },
      {
        script: 'https://unpkg.com/kuromoji@0.1.2/build/kuromoji.js',
        dicPath: 'https://unpkg.com/kuromoji@0.1.2/dict/'
      }
    ];

    function wait(ms) {
      return new Promise(resolve => setTimeout(resolve, ms));
    }

    // CDN停止時にも画面を固めず、別CDNへ切り替える。
    function loadScript(source) {
      return new Promise((resolve, reject) => {
        const script = document.createElement('script');
        const timeout = setTimeout(() => {
          script.remove();
          reject(new Error('kuromoji.jsの読み込みがタイムアウトしました'));
        }, 15000);
        script.src = source.script;
        script.onload = () => {
          clearTimeout(timeout);
          resolve();
        };
        script.onerror = () => {
          clearTimeout(timeout);
          script.remove();
          reject(new Error('kuromoji.jsを読み込めませんでした'));
        };
        document.head.appendChild(script);
      });
    }

    // カタカナをひらがなへ変換する（長音記号などはそのまま保持）。
    function katakanaToHiragana(text) {
      return text.replace(/[ァ-ヶ]/g, char =>
        String.fromCharCode(char.charCodeAt(0) - 0x60)
      );
    }

    // 行頭の空白・記号を読み仮名の判定から除外する。
    function removeLeadingSymbols(text) {
      return text.replace(/^[\s\p{P}\p{S}]+/u, '');
    }

    function getReading(line) {
      const target = removeLeadingSymbols(line);
      if (!target) return '';

      const tokens = tokenizer.tokenize(target);
      return katakanaToHiragana(tokens.map(token => {
        // 辞書にない語や記号は、読みの代わりに表記を使って比較可能にする。
        return token.reading || token.surface_form || '';
      }).join('')).toLocaleLowerCase('ja');
    }

    function loadTokenizer() {
      if (tokenizerPromise) return tokenizerPromise;
      tokenizerPromise = new Promise((resolve, reject) => {
        (async () => {
          let selectedSource = null;
          for (const source of kuromojiSources) {
            try {
              status.textContent = '解析エンジンを読み込み中…';
              await loadScript(source);
              selectedSource = source;
              break;
            } catch (error) {
              console.warn(error.message);
            }
          }
          if (!selectedSource || typeof kuromoji === 'undefined') {
            throw new Error('解析エンジンを読み込めませんでした');
          }

          status.textContent = '辞書を読み込み中…（初回は時間がかかります）';
          await new Promise((resolveBuild, rejectBuild) => {
            let settled = false;
            const timeout = setTimeout(() => {
              if (!settled) rejectBuild(new Error('辞書の読み込みがタイムアウトしました'));
            }, 60000);
            kuromoji.builder({ dicPath: selectedSource.dicPath }).build((error, builtTokenizer) => {
              if (settled) return;
              settled = true;
              clearTimeout(timeout);
              if (error) rejectBuild(error);
              else resolveBuild(builtTokenizer);
            });
          }).then(builtTokenizer => {
            tokenizer = builtTokenizer;
            resolve(tokenizer);
          });
        })().catch(error => {
          tokenizerPromise = null;
          reject(error);
        });
      });
      return tokenizerPromise;
    }

    sortButton.addEventListener('click', async () => {
      sortButton.disabled = true;
      try {
        await loadTokenizer();
        const lines = source.value.split(/\r?\n/)
          .filter(line => line.trim() !== '');
        const sorted = lines.map((line, index) => ({
          line,
          reading: getReading(line),
          index
        })).sort((a, b) => {
          const comparison = a.reading.localeCompare(b.reading, 'ja', {
            sensitivity: 'base',
            numeric: false
          });
          // 同じ読みは入力順を維持する。
          return comparison
            ? (sortOrder.value === 'desc' ? -comparison : comparison)
            : a.index - b.index;
        });

        result.value = sorted.map(item => item.line).join('\n');
        downloadButton.disabled = sorted.length === 0;
        const orderLabel = sortOrder.value === 'desc' ? '逆順' : '昇順';
        status.textContent = `${sorted.length}行を${orderLabel}で並べ替えました。`;
      } catch (error) {
        console.error(error);
        status.textContent = '辞書の読み込みに失敗しました。ネット接続を確認してください。';
      } finally {
        sortButton.disabled = false;
      }
    });

    downloadButton.addEventListener('click', () => {
      if (!result.value) return;
      const blob = new Blob([result.value + '\n'], { type: 'text/plain;charset=utf-8' });
      const url = URL.createObjectURL(blob);
      const link = document.createElement('a');
      link.href = url;
      link.download = 'yomigana-sort-result.txt';
      document.body.appendChild(link);
      link.click();
      link.remove();
      URL.revokeObjectURL(url);
    });

    loadTokenizer().then(() => {
      status.textContent = '準備完了';
    }).catch(error => {
      console.error(error);
      status.textContent = '読み込みに失敗しました。ネット接続を確認して、並べ替えボタンを再度押してください。';
    });
  </script>
</body>
</html>
